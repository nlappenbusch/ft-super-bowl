name: Deploy Super Bowl App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64, docker-prod-01]
    
    steps:
      - name: Heal Docker build cache
        run: |
          echo "Pruning dangling Docker build cache (fix für 'parent snapshot does not exist')..."
          docker builder prune -f || true
          docker image prune -f || true

      - name: Deploy to Production
        run: |
          echo "Starting deployment..."
          bash /opt/super-bowl/deploy.sh
          
      - name: Deployment Status
        if: success()
        run: |
          echo "✅ Deployment successful!"
          echo "App is running on the configured domain or http://<server>:8085"
          
      - name: Deployment Failed
        if: failure()
        run: |
          echo "❌ Deployment failed!"
          echo "Check container logs with: cd /opt/super-bowl && docker compose logs --tail=100"
