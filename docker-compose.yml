services:
  super-bowl-app:
    build:
      context: .
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* müssen zur Build-Zeit vorhanden sein (werden ins Client-JS eingebacken).
      # Compose zieht die Werte automatisch aus der .env-Datei in diesem Ordner.
      args:
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY}
        NEXT_PUBLIC_ADMIN_PASSWORD: ${NEXT_PUBLIC_ADMIN_PASSWORD}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    container_name: super-bowl-app
    restart: unless-stopped
    ports:
      - "8085:3000"  # Externer Port 8085 -> Container Port 3000
    volumes:
      - ./data:/app/data  # Inhalte (events/series/...) + SQLite + settings.json – bleiben persistent & beschreibbar
    # Laufzeit-Secrets (Graph/Brevo/Inbound) kommen aus der .env-Datei (NICHT im Git!)
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_PATH=/app/data/bookings.db
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
