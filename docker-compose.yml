version: '3.8'

services:
  super-bowl-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: super-bowl-app
    restart: unless-stopped
    ports:
      - "8085:3000"  # Externer Port 8085 -> Container Port 3000
    volumes:
      - ./data:/app/data  # SQLite Database persistence
    environment:
      - NODE_ENV=production
      - DATABASE_PATH=/app/data/bookings.db
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
