services:
  super-bowl-app:
    build:
      context: .
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* werden zur Build-Zeit ins Client-JS eingebacken.
      # Werte kommen aus einer optionalen .env-Datei in diesem Ordner; sonst greifen die Defaults.
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://next.faltintravel.com}
        NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME:-Faltin Travel Sports Events}
        NEXT_PUBLIC_ADMIN_PASSWORD: ${NEXT_PUBLIC_ADMIN_PASSWORD:-faltin-admin-2025}
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    container_name: super-bowl-app
    restart: unless-stopped
    ports:
      - "8085:3000"  # Externer Port 8085 -> Container Port 3000
    volumes:
      - ./data:/app/data  # Inhalte + SQLite + settings.json – persistent & beschreibbar
    # Laufzeit-Variablen. ${VAR:-default} => funktioniert AUCH ohne .env (kein harter Fehler).
    environment:
      - NODE_ENV=production
      - DATABASE_PATH=/app/data/bookings.db
      - AUTH_SECRET=${AUTH_SECRET:-}
      - GRAPH_TENANT_ID=${GRAPH_TENANT_ID:-}
      - GRAPH_CLIENT_ID=${GRAPH_CLIENT_ID:-}
      - GRAPH_CLIENT_SECRET=${GRAPH_CLIENT_SECRET:-}
      - GRAPH_MAILBOX=${GRAPH_MAILBOX:-request@faltintravel.com}
      - GRAPH_FROM_NAME=${GRAPH_FROM_NAME:-Faltin Travel}
      - BREVO_API_KEY=${BREVO_API_KEY:-}
      - INBOUND_POLL_SECRET=${INBOUND_POLL_SECRET:-}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
